version: '3.8'

services:
  customerpulse:
    build: .
    container_name: customerpulse-service
    ports:
      - "8000:8000"
    environment:
      - CUSTOMERPULSE_PORT=8000
      - CUSTOMERPULSE_DB_PATH=backend/data/customerpulse.db
    volumes:
      - customerpulse-data:/app/backend/data
    restart: unless-stopped

volumes:
  customerpulse-data:
